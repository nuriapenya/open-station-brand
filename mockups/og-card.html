<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OpenStation · og card</title>
<!--
  The 1200x630 social card, rendered to assets/imagery/og.png.

  A source file rather than a one-off export: the headline here has to match
  the landing page hero, and when that copy changes this can be re-rendered
  instead of redrawn. Every colour is a brand.json token, so the card cannot
  drift from the palette.

  Render:  mockups/render-og-card.sh
-->
<style>
  @font-face {
    font-family: 'Geist';
    src: url('../fonts/Geist-Variable.woff2') format('woff2');
    font-weight: 100 900;
    font-display: block;
  }
  @font-face {
    font-family: 'Geist Mono';
    src: url('../fonts/GeistMono-Variable.woff2') format('woff2');
    font-weight: 100 900;
    font-display: block;
  }

  :root {
    color-scheme: dark;
    --pulse: #e94ff3;
    --starlight: #fffbff;
    --sirius: #9af2ff;
    --lagoon: #9f98ff;
    --void: #0c0b0f;
    --osmium: #99969c;
    --holomesh-1: #afa2e8;
    --holomesh-2: #b7abea;
    --holomesh-3: #c3b8ef;
    --holomesh-glow: #f59fe8;
    --line: rgb(from var(--starlight) r g b / 0.11);
    --line-dash: rgb(from var(--starlight) r g b / 0.2);
    --font-sans: 'Geist', system-ui, sans-serif;
    --font-mono: 'Geist Mono', ui-monospace, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* Fixed at the exact crop. Positioned rather than merely sized so the card
     still fills the frame if the renderer's viewport comes out larger than
     asked for, which otherwise leaves dead void down the right and bottom. */
  html { background: var(--void); }
  body {
    position: fixed;
    inset: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: var(--void);
    font-family: var(--font-sans);
    color: var(--starlight);
    -webkit-font-smoothing: antialiased;
  }

  /* The card is one frame, the same dashed rule the page uses to bound a
     section. Inset so the crop never clips it. */
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    padding: 72px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    isolation: isolate;
  }

  /* Two glows, off-canvas centres so only the falloff shows. Same trick and
     the same two colours the hero uses behind its headline. */
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(58% 78% at 88% 12%, rgb(from var(--pulse) r g b / 0.22), transparent 70%),
      radial-gradient(52% 70% at 6% 96%, rgb(from var(--lagoon) r g b / 0.18), transparent 72%);
  }

  /* The corner ticks, lifted from the page's section frames. */
  .tick {
    position: absolute;
    width: 15px;
    height: 15px;
    z-index: 2;
  }
  .tick::before, .tick::after {
    content: '';
    position: absolute;
    background: var(--pulse);
  }
  .tick::before { left: 0; top: 7px; width: 15px; height: 1px; }
  .tick::after  { top: 0; left: 7px; width: 1px; height: 15px; }
  .tick.tl { left: 32px; top: 32px; }
  .tick.br { right: 32px; bottom: 32px; }

  .rule {
    position: absolute;
    inset: 40px;
    border: 1px dashed var(--line-dash);
    z-index: 1;
    pointer-events: none;
  }

  .lockup {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .lockup svg { width: 40px; height: 40px; display: block; }
  .lockup svg path { fill: var(--starlight); }

  h1 {
    font-size: 76px;
    font-weight: 700;
    line-height: 1.04;
    letter-spacing: -0.028em;
    max-width: 15ch;
  }

  /* The holomesh, flattened to a single linear pass. The landing page runs
     the full eight-glow transcription because the type is animated there;
     at thumbnail size that detail is invisible, so this keeps the same four
     token colours and drops the machinery. */
  .hl {
    background: linear-gradient(
      100deg,
      var(--sirius) 0%,
      var(--holomesh-1) 26%,
      var(--holomesh-3) 48%,
      var(--holomesh-glow) 74%,
      var(--pulse) 100%
    );
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .foot {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 19px;
    letter-spacing: 0.06em;
    color: var(--osmium);
  }
  .foot .dom { color: var(--sirius); }
</style>
</head>
<body>
  <div class="card">
    <i class="rule" aria-hidden="true"></i>
    <i class="tick tl" aria-hidden="true"></i>
    <i class="tick br" aria-hidden="true"></i>

    <div class="lockup">
      <svg viewBox="0 0 80 80" aria-hidden="true"><path d="M38.792 0.0186131C60.8846 -0.649069 79.3313 16.7291 79.9824 38.8223C80.6326 60.8921 63.2773 79.3149 41.208 79.9815C19.1385 80.6488 0.702853 63.3074 0.0195305 41.2383C-0.66441 19.1462 16.6995 0.686396 38.792 0.0186131ZM38.71 9.36236C35.8339 7.89166 32.7628 8.23954 29.8555 9.28033C12.6582 14.7114 3.37017 33.8997 9.45508 50.8067C11.0384 55.2047 13.565 59.4989 16.9609 62.7842C21.6294 67.5336 27.6536 70.7223 34.2061 71.9112C37.0214 72.4165 41.0083 73.0707 43.2295 70.7891C46.4143 67.5174 44.115 64.4383 43.1133 60.8419C42.137 57.2757 41.6165 53.6009 41.5635 49.9044C41.5398 46.776 42.201 42.473 42.8252 39.3565C44.2979 32.0039 46.892 24.7246 44.5537 17.2452C43.5137 14.0551 41.8086 10.9469 38.71 9.36236Z"/></svg>
      OpenStation
    </div>

    <h1>One tab.<br><span class="hl">Your whole WordPress site.</span></h1>

    <div class="foot">
      <span>Free WordPress plugin</span>
      <span class="dom">openstation.me</span>
    </div>
  </div>
</body>
</html>
