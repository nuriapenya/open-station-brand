<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OpenStation · og card</title>
<!--
  The 1200x630 social card, rendered to assets/imagery/og.png.

  A source file rather than a one-off export: every colour is a brand.json
  token, and the chip is the shipped asset rather than a copy, so the card
  cannot drift from the system.

  Why there is no headline on it. A link preview prints og:title and the
  domain right next to the image, and both used to be repeated inside the
  artwork, so half the card was spent saying what the surrounding chrome was
  already saying. Worse, an unfurl renders this around 255px wide: at that
  size the old card's 19px footer was four pixels tall and its 1px dashed rule
  was a fifth of a pixel. What survives 255px is one big shape, so that is
  what this is.

  The elevation is light, not shadow. On Void a drop shadow does nothing, so
  what lifts the chip off the background is the halo reading past its edge:
  the tile is opaque, so the only part of the glow anyone ever sees is the
  ring outside its silhouette.

  The halo is three gaussian blurs rather than radial gradients. A gradient
  interpolates linearly between its stops, so every stop is a kink in the
  falloff that the eye picks up as a faint ring, and two concentric gradients
  are worse still because the slope changes where the inner one ends. A
  blurred disc has no stops to band, and three of them stack without a seam
  because each is already smooth.

  Render:  mockups/render-og-card.sh
-->
<style>
  /* ============ Tokens (brand.json v0.7.1) ============ */
  :root {
    color-scheme: dark;
    --void: #0c0b0f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* Fixed at the exact crop. Positioned rather than merely sized so the card
     still fills the frame if the renderer's viewport comes out larger than
     asked for, which otherwise leaves dead void down the right and bottom. */
  html { background: var(--void); }
  body {
    position: fixed;
    inset: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: var(--void);
  }

  .bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* 340px on a 630px frame, a little over half the height. Centred at y 300
     rather than 315, because 15px above the true middle reads as centred. */
  .chip {
    position: absolute;
    left: 430px; top: 130px;
    width: 340px; height: 340px;
    display: block;
  }
</style>
</head>
<body>
  <svg class="bg" viewBox="0 0 1200 630" role="img"
       xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>The OpenStation chip glowing against a starfield</title>
    <defs>
      <!-- Voidmesh (brand.json mesh.voidmesh), reflowed to 1.905:1 -->
      <linearGradient id="g-void" gradientUnits="userSpaceOnUse" x1="249" y1="737" x2="1027" y2="-198">
        <stop offset="0" stop-color="#010101"/>
        <stop offset=".585" stop-color="#111114"/>
        <stop offset="1" stop-color="#1e1d23"/>
      </linearGradient>

      <!-- Starfield for a 1200 x 630 field. Three depths. -->
      <symbol id="os-stars" viewBox="0 0 1200 630">
        <g fill="#fffbff" opacity=".85">
          <circle cx="172" cy="58" r="1.3"/><circle cx="384" cy="328" r="1.4"/>
          <circle cx="668" cy="290" r="1.3"/><circle cx="860" cy="56" r="1.2"/>
          <circle cx="1092" cy="190" r="1.3"/><circle cx="1000" cy="112" r="1.1"/>
          <circle cx="576" cy="554" r="1.2"/>
        </g>
        <g fill="#fffbff" opacity=".5">
          <circle cx="48" cy="100" r="1"/><circle cx="112" cy="378" r=".8"/>
          <circle cx="240" cy="228" r=".8"/><circle cx="284" cy="516" r="1"/>
          <circle cx="336" cy="120" r=".9"/><circle cx="436" cy="38" r=".8"/>
          <circle cx="480" cy="440" r="1"/><circle cx="528" cy="176" r=".8"/>
          <circle cx="624" cy="76" r=".9"/><circle cx="720" cy="492" r=".8"/>
          <circle cx="764" cy="138" r="1"/><circle cx="808" cy="378" r=".9"/>
          <circle cx="904" cy="240" r=".8"/><circle cx="952" cy="530" r="1"/>
          <circle cx="1048" cy="340" r=".9"/><circle cx="1140" cy="454" r=".8"/>
          <circle cx="1176" cy="88" r="1"/>
        </g>
        <g fill="#fffbff" opacity=".28">
          <circle cx="76" cy="278" r=".7"/><circle cx="200" cy="592" r=".9"/>
          <circle cx="312" cy="404" r=".8"/><circle cx="408" cy="592" r=".7"/>
          <circle cx="504" cy="296" r=".7"/><circle cx="604" cy="378" r=".8"/>
          <circle cx="696" cy="592" r=".9"/><circle cx="792" cy="252" r=".7"/>
          <circle cx="884" cy="592" r=".8"/><circle cx="980" cy="416" r=".7"/>
          <circle cx="1076" cy="574" r=".9"/><circle cx="1160" cy="270" r=".7"/>
          <circle cx="136" cy="176" r=".6"/><circle cx="264" cy="322" r=".6"/>
          <circle cx="364" cy="228" r=".6"/><circle cx="460" cy="176" r=".6"/>
          <circle cx="556" cy="32" r=".6"/><circle cx="652" cy="498" r=".6"/>
          <circle cx="748" cy="378" r=".6"/><circle cx="844" cy="492" r=".6"/>
          <circle cx="940" cy="150" r=".6"/><circle cx="1032" cy="240" r=".6"/>
          <circle cx="1120" cy="352" r=".6"/>
        </g>
      </symbol>

      <!-- The halo. color-interpolation-filters is sRGB on purpose: the
           default is linearRGB, which lightens a blur noticeably and is not
           what the levels below assume. -->
      <filter id="f-halo-rim" x="-200%" y="-200%" width="500%" height="500%" color-interpolation-filters="sRGB">
        <feGaussianBlur stdDeviation="34"/>
      </filter>
      <filter id="f-halo-bloom" x="-200%" y="-200%" width="500%" height="500%" color-interpolation-filters="sRGB">
        <feGaussianBlur stdDeviation="88"/>
      </filter>
      <filter id="f-halo-amb" x="-200%" y="-200%" width="500%" height="500%" color-interpolation-filters="sRGB">
        <feGaussianBlur stdDeviation="193"/>
      </filter>
    </defs>

    <rect width="1200" height="630" fill="url(#g-void)"/>

    <!-- the starfield twice, the second copy turned 180 degrees so the field
         reads denser without a second set of coordinates -->
    <use xlink:href="#os-stars" width="1200" height="630" opacity=".9"/>
    <use xlink:href="#os-stars" width="1200" height="630" opacity=".45"
         transform="translate(1200 630) rotate(180)"/>

    <!-- Three blurred discs, widest first: a very wide ambient that keeps the
         corners off flat black, a mid bloom, and a tight rim that hugs the
         chip. Levels are picked at the chip's edge, 170px out, where a disc of
         radius R blurred by sigma s still reads at about
         0.5(1 + erf((R - 170) / (s * sqrt2))) of its own opacity. That comes
         to 0.045 + 0.10 + 0.066, so about a fifth of full strength right at
         the rim, falling to well under one percent by the corners. -->
    <circle cx="600" cy="300" r="340" fill="#9f98ff" opacity=".055" filter="url(#f-halo-amb)"/>
    <circle cx="600" cy="300" r="221" fill="#ec9bff" opacity=".14" filter="url(#f-halo-bloom)"/>
    <circle cx="600" cy="300" r="184" fill="#fffbff" opacity=".10" filter="url(#f-halo-rim)"/>
  </svg>

  <!-- The shipped asset, not a copy: brand.json's chip rule says the mark
       sits on its Void app tile in every product reference, and the tile's
       baked halo ring, edge stroke and inner highlight come with it. -->
  <img class="chip" src="../assets/logomark-app-circle-holo.svg" alt="">
</body>
</html>
